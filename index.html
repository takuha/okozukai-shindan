<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おこづかい診断</title>
<style>
:root{
  --bg:#fbf3e6; --card:#fffaf2; --ink:#3b2a1a; --sub:#7a6450; --line:#ead8bf;
  --accent:#e8792b; --accent-ink:#fff; --soft:#fde6cc; --green:#06c755; --warn:#b4541a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1812; --card:#2a2119; --ink:#f6eadb; --sub:#c7b29b; --line:#4a3a2b;
    --accent:#f08a3e; --accent-ink:#1f1812; --soft:#3a2b1d; --warn:#f0a070;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1812; --card:#2a2119; --ink:#f6eadb; --sub:#c7b29b; --line:#4a3a2b;
  --accent:#f08a3e; --accent-ink:#1f1812; --soft:#3a2b1d; --warn:#f0a070;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.chara{display:block;width:132px;height:132px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--accent)}
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.say img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex:none}
.say .bubble{background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14px;line-height:1.6}
header .t{font-weight:800;font-size:17px}
header .s{font-size:12px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.count{font-size:12px;color:var(--sub);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
h1{font-size:21px;line-height:1.5;margin:0 0 6px}
.hint{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:2px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer}
.opt:active,.opt.on{border-color:var(--accent);background:var(--soft)}
input[type=text],select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);
  border:2px solid var(--line);border-radius:14px;padding:14px 14px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;
  padding:16px;margin-top:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4}
.btn.line{background:var(--green);color:#fff}
.back{background:none;border:0;color:var(--sub);font:inherit;font-size:14px;margin-top:14px;cursor:pointer;padding:8px}
.lead{font-size:15px;line-height:1.8;margin:0 0 10px}
.type{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;
  border-radius:99px;padding:4px 12px;font-size:13px;margin-bottom:10px}
.note{font-size:11px;line-height:1.6;color:var(--sub);margin:12px 0 0}
.sum{font-size:13px;line-height:1.8;color:var(--sub);background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;white-space:pre-wrap}
.small{font-size:12px;color:var(--sub);line-height:1.7;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="" alt="">
    <div><div class="t">おこづかい診断</div><div class="s">おこづかい君｜10問・約1分</div></div>
  </header>
  <div id="prog"><div class="bar"><i id="barfill"></i></div><div class="count" id="count"></div></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

function setProg(){
  const p = document.getElementById("prog");
  if(step<0 || step>=Q.length){p.style.display="none";return}
  p.style.display="";
  document.getElementById("barfill").style.width = ((step)/Q.length*100)+"%";
  document.getElementById("count").textContent = `${step+1} / ${Q.length}`;
}

  if(step>=Q.length) return result();
  const q = Q[step];
  let body = "";
  if(q.type==="text"){
    body = `<input type="text" id="in" maxlength="20" placeholder="${esc(q.ph)}" value="${esc(A[q.id]||"")}" autocomplete="off" autofocus>
            <button class="btn" id="next">次へ</button>`;
  }else if(q.type==="select"){
    body = `<select id="in"><option value="">選んでください</option>${PREFS.map(p=>`<option${A[q.id]===p?" selected":""}>${p}</option>`).join("")}</select>
            <button class="btn" id="next">次へ</button>`;
  }else{
    body = `<div class="opts">${q.opts.map(o=>`<button class="opt${A[q.id]===o?" on":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }
  app.innerHTML = `<div class="card"><h1>${esc(q.q)}</h1>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:`<p class="hint"></p>`}${body}</div>
    <button class="back" id="back">← もどる</button>`;
  document.getElementById("back").onclick=()=>{step--;render()};
  const inp = document.getElementById("in");
  if(inp){
    if(q.type==="text") setTimeout(()=>inp.focus(),50);
    const nx = document.getElementById("next");
    const chk = ()=>{nx.disabled = !inp.value.trim()};
    chk(); inp.oninput=chk; inp.onchange=chk;
    if(q.type==="text") inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){go(inp.value.trim())}};
    nx.onclick=()=>go(inp.value.trim());
  }else{
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      b.classList.add("on");
      setTimeout(()=>go(b.dataset.v),120);
    });
  }
}

function go(v){
  A[Q[step].id]=v;
  if(Q[step].id==="age" && v==="18歳未満"){step=99;return underage()}
  step++; render();
}

function intro(){
  app.innerHTML = `<div class="card">
    <img class="chara" src="${CHARA}" alt="おこづかい君">
    <h1 style="text-align:center">あなたに合う<br>おこづかいの始め方</h1>
    <p class="lead">10問に答えると、今の暮らしに合った進め方がわかります。最後に結果をおこづかい君へ送ると、担当から個別にご案内します。</p>
    <p class="small">・名前や電話番号は聞きません（ニックネームだけ）<br>・答えはこの画面の中だけで使い、送るボタンを押すまでどこにも届きません</p>
    <button class="btn" id="start">はじめる</button></div>`;
  document.getElementById("start").onclick=()=>{step=0;render()};
}

function underage(){
  setProg(); document.getElementById("prog").style.display="none";
  app.innerHTML = `<div class="card"><h1>ごめんなさい</h1>
    <p class="lead">おこづかい君のご案内は18歳以上の方が対象です。18歳になったら、またぜひ来てください。</p>
    <button class="back" id="re">← 最初にもどる</button></div>`;
  document.getElementById("re").onclick=()=>{step=-1;for(const k in A)delete A[k];render()};
}

// ===== 診断 =====
function diagnose(){
  const amt = Q[5].opts.indexOf(A.amount);   // 0:1万 1:3万 2:5万 3:10万 4:20万
  const t = Q[8].opts.indexOf(A.time);       // 0:30分 1:1h 2:2-3h 3:それ以上
  const w = Q[6].opts.indexOf(A.when);       // 0:今月中 ...
  const TYPES = [
    {type:"1", title:"まずは1つ受け取ってみるタイプ",
     text:"手続きがかんたんなおこづかいを1つだけ選んで、受け取るところまで一緒にやってみましょう。流れがわかれば、2つ目からは1人で進められます。"},
    {type:"2", title:"2〜3つ組み合わせるタイプ",
     text:"おこづかいを2〜3つ組み合わせて、月3万円に近づける進め方です。1つ目で流れを覚えたら、残りは同じ手順のくり返しです。"},
    {type:"3", title:"組み合わせて、友だちにも紹介するタイプ",
     text:"自分の分を何件か受け取りながら、身近な人に1〜2人紹介する進め方です。紹介した人が受け取ると、あなたにもおこづかいが入ります。"},
    {type:"4", title:"紹介する側デビュータイプ",
     text:"自分が受け取るだけでなく、紹介する側（代理店）として動く進め方です。紹介する人を毎月少しずつ増やしていきます。"},
    {type:"5", title:"チームをつくるタイプ",
     text:"紹介してくれる仲間を増やして、チームで動く進め方です。毎日時間を使えて、長く続けられる人に向いています。"}
  ];
  const d = TYPES[Math.max(0,amt)];
  let note = "※金額は目安で、お約束できるものではありません。";
  if(amt>=3 && t===0) note += "1日30分なら、まずは月5万円以内からがおすすめです。";
  if(w===0 && amt>=2) note += "今月中に大きな額をそろえるのはむずかしいので、無理のない額から考えましょう。";
  if(A.why==="返済にあてたい") note += "借り入れをしてまで始める必要はありません。";
  return {...d, note};
}

function buildMessage(d){
  const lines = ["【おこづかい診断】"];
  Q.forEach(q=>lines.push(`${q.label}：${A[q.id]}`));
  lines.push(`診断：タイプ${d.type}（${d.title}）`);
  lines.push("", "この内容でご案内をお願いします。");
  return lines.join("\n");
}

function result(){
  const d = diagnose();
  const msg = buildMessage(d);
  app.innerHTML = `<div class="card">
    <div class="say"><img src="${CHARA}" alt="おこづかい君"><div class="bubble">${esc(A.nick)}さん、答えてくれてありがとう！あなたに合う進め方はこれです。</div></div>
    <span class="type">タイプ ${d.type}／5</span>
    <h1>「${esc(d.title)}」</h1>
    <p class="lead">${esc(d.text)}</p>
    <button class="btn line" id="send">おこづかい君に結果を送る</button>
    <p class="small">押すとLINEのトーク画面に下の内容が入ります。送信ボタンを押すと、担当から${esc(A.contact==="いつでも"?"":A.contact+"に")}ご連絡します。</p>
    <div class="sum">${esc(msg)}</div>
    <p class="note">${esc(d.note)}</p>
  </div>
  <button class="back" id="back">← 答えをなおす</button>`;
  document.getElementById("back").onclick=()=>{step=Q.length-1;render()};
  document.getElementById("send").onclick=()=>send(msg);
}

function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200)}

async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    const ok=document.execCommand("copy");ta.remove();return ok;
  }catch(e){return false}
}

async function send(msg){
  if(OA_ID){
    location.href = `https://line.me/R/oaMessage/${encodeURIComponent(OA_ID)}/?${encodeURIComponent(msg)}`;
  }else{
    const ok = await copy(msg);
    toast(ok?"コピーしました。おこづかい君のトークに貼り付けて送ってください":"下の内容を長押しでコピーして、トークに貼ってください");
  }
}

render();
</script>
